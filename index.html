<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>405 Run</title>
    <style>
      body { margin: 0; font-family: sans-serif; }
      #hud {
        position: fixed;
        top: 20px;
        right: 30px;
        color: #fff;
        font: bold 32px sans-serif;
        text-shadow: 2px 2px 4px #000;
        z-index: 10;
      }
      #gameOver {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        z-index: 20;
      }
      #gameOver h1 { font-size: 64px; margin: 0; }
      #finalScore { font-size: 32px; margin-top: 20px; }
      #restart {
        margin-top: 30px;
        padding: 12px 32px;
        font-size: 20px;
        cursor: pointer;
        background: #fff;
        border: none;
        border-radius: 6px;
      }
      #restart:hover { background: #ddd; }
    </style>
  </head>
  <body>
    <div id="hud">Score: 0</div>
    <div id="gameOver">
      <h1>GAME OVER</h1>
      <div id="finalScore"></div>
      <div id="highScore"></div>
      <button id="restart">Restart</button>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
